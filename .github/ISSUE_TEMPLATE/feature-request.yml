name: Feature Request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - /clarity
        - /agent-skill-creator
        - /linear-walkthrough
        - Pipeline (cross-skill)
        - Installer / setup
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or pain point.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought of and why they're less ideal.
